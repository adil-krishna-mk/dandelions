<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumina Bloom — Interactive Arduino Dandelion Garden</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Canvas for Dandelion Garden Simulation -->
  <canvas id="garden-canvas"></canvas>

  <!-- Ambient Atmospheric Overlay -->
  <div class="vignette"></div>

  <!-- HUD / Control Bar (Glassmorphism, Auto-hiding for Exhibition Mode) -->
  <header class="hud-bar" id="hud">
    <div class="brand">
      <div class="brand-badge">
        <span class="pulse-dot"></span>
        <span class="badge-text">LIVE SENSOR</span>
      </div>
      <h1 class="brand-title">Lumina Bloom</h1>
      <span class="brand-subtitle">Interactive Dandelion Garden</span>
    </div>

    <!-- Live Hardware & Signal Status -->
    <div class="sensor-dock">
      <!-- Arduino Nano / Hardware Status -->
      <div class="status-card" id="esp32-status-card">
        <div class="status-icon" id="esp32-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="4" y="4" width="16" height="16" rx="2"></rect>
            <rect x="9" y="9" width="6" height="6"></rect>
            <path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3"></path>
          </svg>
        </div>
        <div class="status-info">
          <span class="status-label" id="board-label">Arduino Nano (A0 / D2)</span>
          <span class="status-val" id="esp32-state-text">Disconnected</span>
        </div>
      </div>

      <!-- Game Challenge Progress Card -->
      <div class="status-card" id="challenge-stats-card" title="Completely clear a dandelion to score!">
        <div class="status-icon" style="color: #facc15;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path>
          </svg>
        </div>
        <div class="status-info">
          <span class="status-label">Cleared</span>
          <span class="status-val"><span id="cleared-count">0</span> / <span id="total-count">16</span></span>
        </div>
      </div>

      <!-- Live Blowing / Breath Intensity Meter -->
      <div class="meter-card">
        <div class="meter-header">
          <span class="meter-title">Wind Force</span>
          <span class="meter-pct" id="intensity-text">0%</span>
        </div>
        <div class="meter-track">
          <div class="meter-fill" id="intensity-bar"></div>
        </div>
      </div>
    </div>

    <!-- Action Toolbar -->
    <div class="toolbar">
      <!-- Connect Arduino Nano via WebSerial -->
      <button class="btn btn-primary" id="btn-serial" title="Connect Arduino Nano via USB Serial">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
        </svg>
        <span id="btn-serial-text">Connect Arduino</span>
      </button>

      <!-- Web Audio Microphone (Breath) -->
      <button class="btn btn-secondary" id="btn-mic" title="Use Microphone for Breath Detection">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
          <line x1="12" y1="19" x2="12" y2="23"></line>
          <line x1="8" y1="23" x2="16" y2="23"></line>
        </svg>
        <span id="btn-mic-text">Breath (Mic)</span>
      </button>

      <!-- Sound Toggle -->
      <button class="btn btn-icon" id="btn-audio" title="Toggle Soundscape">
        <svg id="icon-sound-on" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        </svg>
        <svg id="icon-sound-off" class="hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <line x1="23" y1="9" x2="17" y2="15"></line>
          <line x1="17" y1="9" x2="23" y2="15"></line>
        </svg>
      </button>

      <!-- Settings / Calibration Toggle -->
      <button class="btn btn-icon" id="btn-settings" title="Adjust Sensitivity">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>

      <!-- Fullscreen Exhibition Mode -->
      <button class="btn btn-icon" id="btn-fullscreen" title="Fullscreen Exhibition Mode">
        <svg id="icon-fs-enter" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
        </svg>
        <svg id="icon-fs-exit" class="hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- Settings Flyout Menu -->
  <div class="settings-modal hidden" id="settings-modal">
    <div class="modal-header">
      <h3>Exhibition Controls</h3>
      <button class="close-btn" id="btn-close-settings">&times;</button>
    </div>
    <div class="modal-body">
      <div class="control-group">
        <label for="select-difficulty">
          <span>Game Difficulty / Strength</span>
          <span class="range-val" id="val-difficulty">Normal</span>
        </label>
        <select id="select-difficulty" class="select-input">
          <option value="1.0" selected>Standard (Requires Genuine Lung Strength)</option>
          <option value="1.45">Gale Force Challenge (Heavy Breath Strength)</option>
          <option value="0.7">Gentle Breeze (Easy / Relaxing)</option>
        </select>
      </div>

      <div class="control-group">
        <label for="slider-sensitivity">
          <span>Blowing Sensitivity</span>
          <span class="range-val" id="val-sensitivity">1.2x</span>
        </label>
        <input type="range" id="slider-sensitivity" min="0.4" max="3.0" step="0.1" value="1.2">
      </div>

      <div class="control-group">
        <label for="slider-flowers">
          <span>Dandelion Density</span>
          <span class="range-val" id="val-flowers">16 Flowers</span>
        </label>
        <input type="range" id="slider-flowers" min="6" max="24" step="1" value="16">
      </div>

      <div class="control-group">
        <label for="select-color-theme">Atmosphere Palette</label>
        <select id="select-color-theme" class="select-input">
          <option value="exhibition">Luminous Exhibition (Gold, Cyan Opal, Rose & Mint)</option>
          <option value="bioluminescent">Bioluminescent Deep Forest</option>
          <option value="ethereal">Pure Ethereal Silver & Moonstone</option>
          <option value="sunset">Warm Sunset Glow</option>
        </select>
      </div>

      <div class="control-group checkbox-row">
        <label class="toggle-label" for="chk-autohide">
          <input type="checkbox" id="chk-autohide" checked>
          <span class="toggle-custom"></span>
          <span>Auto-hide HUD during Exhibition (12s idle)</span>
        </label>
      </div>

      <div class="control-group">
        <button class="btn btn-full btn-ghost" id="btn-manual-blow">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"></path>
            <path d="M9.6 4.6A2 2 0 1 1 11 8H2"></path>
            <path d="M12.6 19.4A2 2 0 1 0 14 16H2"></path>
          </svg>
          Simulate Blow (Or Press Spacebar)
        </button>
      </div>
    </div>
  </div>

  <!-- Soft Exhibition Instruction Cue (Fades away once interaction starts) -->
  <div class="interaction-hint" id="interaction-hint">
    <div class="hint-icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M12 2a4 4 0 0 0-4 4v7a4 4 0 0 0 8 0V6a4 4 0 0 0-4-4z"></path>
        <path d="M19 10v3a7 7 0 0 1-14 0v-3"></path>
        <line x1="12" y1="20" x2="12" y2="24"></line>
        <line x1="8" y1="24" x2="16" y2="24"></line>
      </svg>
    </div>
    <div class="hint-text">
      <strong>Blow into mic, swipe screen, or sweep mouse</strong>
      <span>Watch the glowing dandelion seeds take flight</span>
    </div>
  </div>

  <!-- Scripts -->
  <script src="audio.js"></script>
  <script src="input.js"></script>
  <script src="dandelion.js"></script>
</body>
</html>
